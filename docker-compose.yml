services:
  db:
    image: postgres:16
    container_name: wimsfp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafe
      POSTGRES_USER: api
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d cafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./WIMSFP-back
      dockerfile: Dockerfile
    container_name: wimsfp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=cafe;Username=api;Password=123;"
    ports:
      - "5094:8080"

  front-warehouse:
    build:
      context: ./WIMSFP-front-warehouse
      dockerfile: Dockerfile
    container_name: wimsfp-front-warehouse
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

  front-client:
    build:
      context: ./WIMSFP-front-client
      dockerfile: Dockerfile
    container_name: wimsfp-front-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    # Клиентский nginx проксирует /api/ внутрь сети на сервис api.
    volumes:
      - ./nginx/client.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
